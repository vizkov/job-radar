name: job-radar

on:
  schedule:
    - cron: "47 2,8,14 * * *"  # 08:17, 14:17, 20:17 IST: fresher listings, earlier applications
  workflow_dispatch: {}

permissions: {}   # granted per job below

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  guard:
    # Runs the real job only in a PRIVATE repo: in a public one the digests, issues and
    # logs would publish your job search. To run in a public repo anyway, set the
    # repository variable JOB_RADAR_ALLOW_PUBLIC=true (Settings -> Variables -> Actions).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PUBLIC: ${{ vars.JOB_RADAR_ALLOW_PUBLIC }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" = "true" ] || [ "$ALLOW_PUBLIC" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Public repository: skipped so your job search isn't published. Use a private copy (see README) or set JOB_RADAR_ALLOW_PUBLIC=true."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  radar:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    permissions:
      contents: write   # commit state/ and digests/
      issues: write     # open role issues and update the Radar status issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"   # must match the interpreter requirements.txt was locked with
          cache: pip
      # The ONLY step that sees the mailbox password. It runs before pip install and with
      # -I -S, so no third-party code is on the machine or in the process. It saves the
      # alert emails to .alert_mail/ (never committed); radar.py parses them without secrets.
      - name: Fetch job-alert emails
        continue-on-error: true
        run: python -I -S tools/fetch_alert_emails.py --out .alert_mail --days 3
        env:
          JOBALERT_IMAP_USER: ${{ secrets.JOBALERT_IMAP_USER }}
          JOBALERT_IMAP_PASSWORD: ${{ secrets.JOBALERT_IMAP_PASSWORD }}

      # Same rules: the second (and last) step that sees the mailbox password. It saves emails about the roles you
      # applied to (receipts, replies, interview invitations) to .app_mail/ (never committed); the ledger step below
      # classifies them without secrets.
      - name: Fetch application mail
        continue-on-error: true
        run: python -I -S tools/fetch_application_mail.py --out .app_mail --days 4
        env:
          JOBALERT_IMAP_USER: ${{ secrets.JOBALERT_IMAP_USER }}
          JOBALERT_IMAP_PASSWORD: ${{ secrets.JOBALERT_IMAP_PASSWORD }}

      - run: pip install --require-hashes -r requirements.txt

      - id: radar
        run: python radar.py --quiet   # counts only: keep the digest out of Actions logs
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}   # search-only key; empty if not set (reed stays off)

      # New roles -> one issue each (labelled `role`); the Project's "Auto-add to project"
      # workflow puts them on the board. Capped per run; the rest stay queued in state/.
      - name: Add new roles to the board
        continue-on-error: true   # a GitHub hiccup must not lose the commit below
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/board_sync.py roles

      - name: Flag roles that are no longer listed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/board_sync.py stale

      - name: Update the Radar status issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/board_sync.py status

      - name: Log application mail
        continue-on-error: true
        run: python tools/app_mail.py ingest --dir .app_mail

      - name: Commit state
        run: |
          git config user.name  "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add state digests data/matches.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "radar: $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; [ "$i" = 3 ] && exit 1; sleep 10; done  # a local push may land mid-run
